name: CI

concurrency:
  group: portavero-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Commit initial dependency lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add reproducible npm lockfile"
            git push
          fi
      - name: Summarize dependency audit
        run: |
          npm audit --json > audit-report.json || true
          node -e 'const a=require("./audit-report.json"); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, advisories:Object.values(a.vulnerabilities||{}).map(v=>({name:v.name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x === "string" ? x : x.title)}))},null,2))'
      - name: Enforce high-severity dependency audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
